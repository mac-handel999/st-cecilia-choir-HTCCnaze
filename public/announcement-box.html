<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcement Box - St. Cecilia Choir HTCC Naze</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/announcement-box.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A0000">
  <link rel="icon" type="image/jpeg" href="IMAGES/choir-logo.jpg">
  <link rel="apple-touch-icon" href="IMAGES/choir-logo.jpg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="STCECILIA">
</head>
<body class="portal-page">

  <div id="page-loader">
    <img src="IMAGES/choir-logo.jpg" alt="Loading...">
    <span class="loader-text">St. Cecilia Choir</span>
  </div>

  <header class="portal-header">
    <div class="portal-header-inner">
      <a href="index.html" class="portal-logo">
        <img loading="lazy" src="IMAGES/choir-logo.jpg" alt="St. Cecilia Choir Logo" class="portal-logo-img">
        <span class="portal-logo-text">St. Cecilia Choir</span>
      </a>
      <nav class="portal-nav">
        <a href="member-home.html" class="portal-nav-link">Home</a>
        <a href="scores.html" class="portal-nav-link">Scores</a>
        <a href="attendance.html" class="portal-nav-link">Attendance</a>
        <a href="profile.html" class="portal-nav-link">Profile</a>
      </nav>
      <div class="portal-header-actions">
        <a href="notifications.html" class="portal-icon-btn">
          <span class="material-symbols-outlined">notifications</span><span class="notification-badge"></span>
        </a>
      </div>
    </div>
  </header>

  <main class="page-content portal-page-content">
    <div class="container" style="padding-top: 2rem; padding-bottom: 3rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <img loading="lazy" src="IMAGES/choir-logo.jpg" alt="Choir Logo" class="page-logo" style="width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid var(--color-accent); margin-bottom: 1rem;">
        <h1 class="page-title">Announcement Box</h1>
        <p class="page-subtitle">Send broadcast announcements to the entire choir</p>
      </div>

      <div class="card" style="padding: 1.5rem; margin-bottom: 2rem; max-width: 800px; margin-left: auto; margin-right: auto;">
        <h2 style="font-family: var(--font-heading); font-size: 1.1rem; font-weight: 700; color: var(--color-primary); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
          <span class="material-symbols-outlined">campaign</span> New Announcement
        </h2>
        <form id="announcement-form" style="display: flex; flex-direction: column; gap: 1rem;">
          <div>
            <label class="form-label" for="ann-title">Title *</label>
            <input type="text" id="ann-title" class="form-control" placeholder="Announcement title" required>
          </div>
          <div>
            <label class="form-label" for="ann-message">Message *</label>
            <textarea id="ann-message" class="form-control" rows="4" placeholder="Type your announcement here..." required></textarea>
          </div>
          <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
            <div>
              <label class="form-label" for="ann-date">Date (optional)</label>
              <input type="date" id="ann-date" class="form-control">
            </div>
            <div>
              <label class="form-label" for="ann-time">Time (optional)</label>
              <input type="time" id="ann-time" class="form-control">
            </div>
            <div>
              <label class="form-label" for="ann-link">Link (optional)</label>
              <input type="url" id="ann-link" class="form-control" placeholder="https://example.com">
            </div>
          </div>
          <button type="submit" class="btn btn-primary">
            <span class="material-symbols-outlined" style="font-size: 18px;">send</span> Send Announcement
          </button>
          <div id="announcement-alert"></div>
        </form>
      </div>

      <div style="max-width: 800px; margin-left: auto; margin-right: auto;">
        <h2 style="font-family: var(--font-heading); font-size: 1.1rem; font-weight: 700; color: var(--color-primary); margin-bottom: 1rem;">Recent Announcements</h2>
        <div id="announcements-list"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="js/shared.js"></script>
  <script src="js/announcement-box.js"></script>
  <nav class="portal-bottom-nav">
    <a href="member-home.html" class="portal-bottom-link">
      <span class="material-symbols-outlined">home</span>
      <span>Home</span>
    </a>
    <a href="cecilia-ai.html" class="portal-bottom-link">
      <span class="material-symbols-outlined">psychology</span>
      <span>Cecilia AI</span>
    </a>
    <a href="scores.html" class="portal-bottom-link">
      <span class="material-symbols-outlined">library_music</span>
      <span>Scores</span>
    </a>
    <a href="members-directory.html" class="portal-bottom-link">
      <span class="material-symbols-outlined">groups</span>
      <span>Members</span>
    </a>
    <a href="profile.html" class="portal-bottom-link">
      <span class="material-symbols-outlined">person</span>
      <span>Profile</span>
    </a>
  </nav>
</body>
</html>
