<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scores - St. Cecilia Choir HTCC Naze</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A0000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="STCECILIA">
  <link rel="icon" type="image/jpeg" href="IMAGES/choir-logo.jpg">
  <link rel="apple-touch-icon" href="IMAGES/choir-logo.jpg">
</head>
  <body class="portal-page">

  <header class="portal-header">
    <div class="portal-header-inner">
      <a href="index.html" class="portal-logo">
        <img src="IMAGES/choir-logo.jpg" alt="St. Cecilia Choir Logo" class="portal-logo-img">
        <span class="portal-logo-text">St. Cecilia Choir</span>
      </a>
      <nav class="portal-nav">
        <a href="member-home.html" class="portal-nav-link">Home</a>
        <a href="scores.html" class="portal-nav-link active">Scores</a>
        <a href="attendance.html" class="portal-nav-link">Attendance</a>
        <a href="profile.html" class="portal-nav-link">Profile</a>
      </nav>
      <div class="portal-header-actions">
        <a href="notifications.html" class="portal-icon-btn">
          <span class="material-symbols-outlined">notifications</span>
        </a>
      </div>
    </div>
  </header>

  <main class="page-content portal-page-content">
      <div class="container" style="padding-top: 2rem; padding-bottom: 3rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
          <img src="IMAGES/choir-logo.jpg" alt="Choir Logo" class="page-logo" style="width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid var(--color-accent); margin-bottom: 1rem;">
          <h1 class="page-title">Musical Scores</h1>
          <p class="page-subtitle">Browse and download repertoire</p>
        </div>

        <div class="search-container" style="max-width: 500px; margin: 0 auto 2rem;">
          <span class="material-symbols-outlined search-icon">search</span>
          <input type="text" id="scores-search" class="search-input" placeholder="Search scores by name or category..." />
        </div>

        <section style="margin-bottom: 2rem;">
          <h2 class="section-heading" style="font-size: 1rem; font-weight: 600; color: var(--color-primary); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <span class="material-symbols-outlined">folder_open</span> Categories
          </h2>
          <div class="folder-grid" id="score-categories" style="margin-top: 0.5rem;"></div>
        </section>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
          <h2 class="section-heading" style="font-size: 1.25rem; font-weight: 700; color: var(--color-primary); margin: 0;">
            <span class="material-symbols-outlined">library_music</span> Available Scores
          </h2>
          <button type="button" id="sort-toggle" class="btn btn-outline btn-sm">
            <span class="material-symbols-outlined" style="font-size: 16px;">sort_by_alpha</span> A-Z
          </button>
        </div>

        <div class="card" style="padding: 1.5rem; margin-bottom: 2rem;">
          <h2 style="font-family: var(--font-heading); font-size: 1.1rem; font-weight: 700; color: var(--color-primary); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <span class="material-symbols-outlined filled">upload_file</span> Upload Score
          </h2>
          <form id="upload-score-form" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
              <label class="form-label" for="score-file">PDF File *</label>
              <input type="file" id="score-file" class="form-control" accept="application/pdf" required>
            </div>
            <div>
              <label class="form-label" for="score-category">Category *</label>
              <select id="score-category" class="form-select" required>
                <option value="">Select category</option>
                <option value="general">General Scores</option>
                <option value="entrance">Entrance Scores</option>
                <option value="kyrie">Kyrie Eleison</option>
                <option value="gloria">Gloria</option>
                <option value="gospel-acclamation">Gospel Acclamation</option>
                <option value="creed">Apostles' Creed</option>
                <option value="prayer-faithful">Prayer of the Faithful</option>
                <option value="offertory">Offertory</option>
                <option value="communion">Communion</option>
                <option value="dismissal">Dismissal</option>
                <option value="classicals">Classicals</option>
                <option value="folk">Folk</option>
                <option value="burial">Burial</option>
                <option value="christmas">Christmas</option>
                <option value="lenten">Lenten</option>
                <option value="easter">Easter</option>
                <option value="wedding">Wedding</option>
                <option value="ebooks">E-Books</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">
              <span class="material-symbols-outlined" style="font-size: 18px;">cloud_upload</span> Upload Score
            </button>
            <div id="upload-alert"></div>
          </form>
        </div>

        <div id="scores-list" class="scores-list"><div class="spinner"></div></div>
      </div>
    </main>

    <div id="toast-container"></div>

    <script src="js/shared.js"></script>
    <script src="js/musical-score.js"></script>
    <nav class="portal-bottom-nav">
    <a href="member-home.html" class="portal-bottom-link">
      <span class="material-symbols-outlined">home</span>
      <span>Home</span>
    </a>
    <a href="cecilia-ai.html" class="portal-bottom-link">
      <span class="material-symbols-outlined">psychology</span>
      <span>Cecilia AI</span>
    </a>
    <a href="scores.html" class="portal-bottom-link">
      <span class="material-symbols-outlined">library_music</span>
      <span>Scores</span>
    </a>
    <a href="members-directory.html" class="portal-bottom-link">
      <span class="material-symbols-outlined">groups</span>
      <span>Members</span>
    </a>
    <a href="profile.html" class="portal-bottom-link">
      <span class="material-symbols-outlined">person</span>
      <span>Profile</span>
    </a>
  </nav>
</body>
</html>
